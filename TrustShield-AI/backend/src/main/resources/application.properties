# Spring Boot Server Port configuration
server.port=8080

# MySQL Database connection parameters
spring.datasource.url=jdbc:mysql://localhost:3306/truthshield_ai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration scripts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Security & CORS setups for standard React applications
spring.security.user.name=admin


# Gemini AI Integration Configuration
gemini.api.key=${GEMINI_API_KEY}
